<script>
function fill(){
  const G=DASS.G,P=DASS.P,set=(id,v)=>document.getElementById(id).textContent=v;
  let a=0,b=0;
  G.forEach((g,i)=>{if(g.dep[0]>G[a].dep[0])a=i;if(P.dep[i][4]>P.dep[b][4])b=i});
  set("v1",G.reduce((s,g)=>s+g.N,0).toLocaleString());
  set("v2",gname(G[a].n)+" · "+G[a].dep[0].toFixed(1));
  set("v3",gname(G[b].n)+" · "+(P.dep[b][4]*100).toFixed(1)+"%");
}
window.onLang=fill;window.onData=fill;
fill();
