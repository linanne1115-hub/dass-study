<script>
window.PAGE_TEXT={
zh:{doc:"關於研究｜婚姻狀態與憂鬱、焦慮、壓力",h:"關於研究",
s1:"資料來源",
s1b:"<p>資料來自網路版 Depression Anxiety Stress Scales（DASS）。問卷開放給任何人填寫，多數人是為了取得個人化的測驗結果而作答。測驗結束後，受試者可自願完成一份研究問卷，並回答「是」，表示答案屬實且同意用於研究，才會納入資料。資料蒐集期間為 2017 至 2019 年。</p><p>本站的圖表使用整理後的摘要表（Google Sheets 的分組比較表），內容包含各婚姻狀態的人數、各分量表平均與標準差，以及嚴重度各等級的比例。</p>",
s2:"研究方法",
s2b:"<ul><li><b>量表：</b>DASS-42 共 42 題，受試者以 1–4 分評定過去一週的符合程度；憂鬱、焦慮、壓力三個分量表各自加總成分量表總分。分量表總分與嚴重度等級的計算規則，依分析時的設定。</li><li><b>資料清洗：</b>排除有勾選任何一個不存在字（VCL6、VCL9、VCL12）的資料；年齡小於 7 歲或大於 90 歲的資料；母親生育子女數（familysize）為 0 或大於 20 的資料。</li><li><b>分組比較：</b>依婚姻狀態（未婚、已婚、曾婚）計算人數、平均數、標準差與 95% 信賴區間（平均數 ± 1.96 × SD ÷ √n），並計算嚴重度五個等級（正常、輕度、中度、重度、極重度）占各組人數的比例。</li></ul>",
s3:"樣本限制",
s3b:"<ul><li>樣本是自願上網填答的便利樣本，不代表一般人口，結果不能直接推論到所有人。</li><li>三組人數差異很大，人數最少的組別估計較不穩定，信賴區間也較寬。</li><li>本研究是描述性、相關性的比較，不能推論婚姻狀態造成症狀差異。年齡等因素可能混淆結果，例如已婚者的平均年齡通常較高。</li><li>DASS 為自陳式篩檢工具，分數與等級不等於臨床診斷。</li><li>資料依自述作答，且為一次性的橫斷資料，無法觀察同一個人的變化。</li></ul>"},
en:{doc:"About | Marital Status and Depression, Anxiety, and Stress",h:"About the study",
s1:"Data source",
s1b:"<p>The data come from an online version of the Depression Anxiety Stress Scales (DASS). The survey was open to anyone, and most people took it to get personalized results. At the end, respondents could voluntarily complete a research survey and answer “yes” to confirm their answers were accurate and could be used for research; only those responses are included. Data were collected between 2017 and 2019.</p><p>The charts on this site use a summary table (the group-comparison table in Google Sheets) containing each marital status’s sample size, subscale means and standard deviations, and the proportion in each severity level.</p>",
s2:"Methods",
s2b:"<ul><li><b>Scale:</b> the DASS-42 has 42 items, each rated 1–4 for how much it applied over the past week; the Depression, Anxiety and Stress subscale totals are the sums of their items. Scoring rules and severity levels follow the settings used in the analysis.</li><li><b>Data cleaning:</b> excluded responses that checked any of the non-existent words (VCL6, VCL9, VCL12); ages below 7 or above 90; and mother’s number of children (familysize) equal to 0 or greater than 20.</li><li><b>Group comparison:</b> for each marital status (never married, married, previously married) we computed the sample size, mean, standard deviation and 95% confidence interval (mean ± 1.96 × SD ÷ √n), plus the proportion in each of five severity levels (normal, mild, moderate, severe, extremely severe).</li></ul>",
s3:"Sample limitations",
s3b:"<ul><li>The sample is a self-selected online convenience sample and does not represent the general population, so results cannot be generalized to everyone.</li><li>Group sizes differ greatly; estimates for the smallest group are less stable and its confidence intervals are wider.</li><li>This is a descriptive, correlational comparison and cannot show that marital status causes differences in symptoms. Factors such as age may confound results (married people are typically older).</li><li>The DASS is a self-report screening tool; scores and levels are not clinical diagnoses.</li><li>Responses are self-reported and cross-sectional, so changes within the same person cannot be observed.</li></ul>"}};
</script>
